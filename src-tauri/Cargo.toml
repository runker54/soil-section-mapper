[package]
name = "soil-section-studio"
version = "0.0.1"
description = "土壤断面制图工具 SoilSection Mapper"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
png = "0.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
